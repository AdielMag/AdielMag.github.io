<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <marker id="bfMut" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8b98a5"/></marker>
    <marker id="bfVio" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a371f7"/></marker>
    <style>
      text { fill: #e6edf3; }
      .ttl  { font-size: 21px; font-weight: 700; }
      .sub  { font-size: 12.5px; fill: #8b98a5; }
      .t    { font-size: 14px; font-weight: 600; }
      .s    { font-size: 11px; fill: #8b98a5; }
      .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
      .lbl  { font-size: 11.5px; fill: #c9d4df; }
    </style>
  </defs>

  <rect width="900" height="470" fill="#0f1419"/>
  <text x="40" y="46" class="ttl">One query, three engines, one list</text>
  <text x="40" y="70" class="sub">“All” mode runs text, filename, and symbol search together - results arrive tagged by section.</text>

  <!-- query box -->
  <rect x="40" y="104" width="200" height="72" rx="12" fill="#1a212b" stroke="#a371f7" stroke-width="1.5"/>
  <text x="58" y="130" class="t" fill="#c4b1ee">Ctrl+Shift+F</text>
  <rect x="58" y="140" width="164" height="22" rx="5" fill="#12141a"/>
  <text x="66" y="156" class="mono" fill="#e6edf3" font-size="11.5">MatchmakingQueue</text>

  <path d="M240,140 L292,140" stroke="#a371f7" stroke-width="2" fill="none" marker-end="url(#bfVio)"/>

  <!-- three engines -->
  <rect x="300" y="96" width="270" height="58" rx="10" fill="#16231a" stroke="#3fb950"/>
  <text x="318" y="120" class="t" fill="#56c96a">Text</text>
  <text x="318" y="140" class="s">native ripgrep · streaming stdout</text>
  <rect x="500" y="106" width="56" height="20" rx="5" fill="#12261a"/>
  <text x="528" y="120" class="mono" font-size="10" fill="#56c96a" text-anchor="middle">rg</text>

  <rect x="300" y="166" width="270" height="58" rx="10" fill="#1c1d26" stroke="#6cb6ff"/>
  <text x="318" y="190" class="t" fill="#6cb6ff">Files</text>
  <text x="318" y="210" class="s">fuzzy path score · substring wins</text>
  <rect x="490" y="176" width="66" height="20" rx="5" fill="#141b26"/>
  <text x="523" y="190" class="mono" font-size="10" fill="#6cb6ff" text-anchor="middle">--files</text>

  <rect x="300" y="236" width="270" height="58" rx="10" fill="#25201a" stroke="#ffd23f"/>
  <text x="318" y="260" class="t" fill="#ffd23f">Symbols</text>
  <text x="318" y="280" class="s">workspace symbol provider (LSP)</text>
  <rect x="500" y="246" width="56" height="20" rx="5" fill="#241d10"/>
  <text x="528" y="260" class="mono" font-size="10" fill="#ffd23f" text-anchor="middle">LSP</text>

  <path d="M292,140 L296,125" stroke="#8b98a5" stroke-width="1.5" fill="none" marker-end="url(#bfMut)"/>
  <path d="M292,140 L296,195" stroke="#8b98a5" stroke-width="1.5" fill="none" marker-end="url(#bfMut)"/>
  <path d="M292,140 L296,265" stroke="#8b98a5" stroke-width="1.5" fill="none" marker-end="url(#bfMut)"/>

  <path d="M570,125 L616,180" stroke="#8b98a5" stroke-width="1.5" fill="none" marker-end="url(#bfMut)"/>
  <path d="M570,195 L616,196" stroke="#8b98a5" stroke-width="1.5" fill="none" marker-end="url(#bfMut)"/>
  <path d="M570,265 L616,212" stroke="#8b98a5" stroke-width="1.5" fill="none" marker-end="url(#bfMut)"/>

  <!-- merged panel -->
  <rect x="622" y="96" width="238" height="198" rx="12" fill="#161b22" stroke="#8b98a5" stroke-width="1.5"/>
  <text x="640" y="122" class="t">Floating panel</text>
  <text x="640" y="140" class="s">sectioned, keyboard-navigable</text>
  <rect x="640" y="150" width="202" height="18" rx="4" fill="#12261a"/>
  <text x="648" y="163" class="mono" font-size="10" fill="#56c96a">TEXT · 41 hits in 12 files</text>
  <rect x="640" y="172" width="202" height="18" rx="4" fill="#141b26"/>
  <text x="648" y="185" class="mono" font-size="10" fill="#6cb6ff">FILES · MatchmakingQueue.cs</text>
  <rect x="640" y="194" width="202" height="18" rx="4" fill="#241d10"/>
  <text x="648" y="207" class="mono" font-size="10" fill="#ffd23f">SYMBOLS · class, 2 methods</text>
  <text x="640" y="234" class="s">↑ ↓ to move · Enter to open</text>
  <text x="640" y="252" class="s">Esc to close · reuses open tabs</text>
  <text x="640" y="276" class="s">detaches to its own OS window</text>

  <!-- preview pane -->
  <rect x="300" y="320" width="560" height="118" rx="12" fill="#12141a" stroke="#a371f7"/>
  <text x="318" y="344" class="t" fill="#c4b1ee">Live preview - editable</text>
  <text x="318" y="362" class="s">contextLines around the hit, syntax + semantic tokens · Ctrl+S writes to the real file</text>
  <rect x="318" y="374" width="524" height="18" rx="4" fill="#0f1419"/>
  <text x="326" y="387" class="mono" font-size="10.5" fill="#8b98a5">  38   private readonly MatchmakingQueue _queue;</text>
  <rect x="318" y="396" width="524" height="18" rx="4" fill="#1d2620"/>
  <text x="326" y="409" class="mono" font-size="10.5" fill="#56c96a">  42   _queue = new MatchmakingQueue(cfg);</text>
  <rect x="318" y="418" width="524" height="14" rx="4" fill="#0f1419"/>
  <text x="326" y="429" class="mono" font-size="9.5" fill="#8b98a5">  43   …</text>

  <text x="40" y="344" class="lbl">No result opens a file</text>
  <text x="40" y="364" class="s">until you press Enter -</text>
  <text x="40" y="382" class="s">the preview pane carries</text>
  <text x="40" y="400" class="s">the context, so browsing</text>
  <text x="40" y="418" class="s">40 hits doesn't leave 40</text>
  <text x="40" y="436" class="s">tabs behind you.</text>
</svg>
